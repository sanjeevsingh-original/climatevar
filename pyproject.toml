[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "climatevar"
version = "0.1.0.dev0"
description = "A Python library for reproducible climate and atmospheric science analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanjeev Singh" }]
keywords = ["climate", "climate-science", "atmospheric-science", "meteorology", "xarray", "extremes", "precipitation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["numpy>=1.24", "xarray>=2024.1"]

[project.optional-dependencies]
stats = ["scipy>=1.10"]
plot = ["matplotlib>=3.7"]
io = ["netCDF4>=1.6", "h5netcdf>=1.3", "cfgrib>=0.9.14", "eccodes>=2.31"]
all = ["scipy>=1.10", "matplotlib>=3.7", "netCDF4>=1.6", "h5netcdf>=1.3", "cfgrib>=0.9.14", "eccodes>=2.31"]
test = ["pytest>=8.0", "pandas>=2.0"]
dev = [
  "pytest>=8.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "netCDF4>=1.6",
  "h5netcdf>=1.3",
  "cfgrib>=0.9.14",
  "eccodes>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["src/climatevar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
