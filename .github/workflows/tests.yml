name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test,stats]"
      - name: Run tests
        run: python -m pytest

  rclimdex-validation:
    name: RClimDex external validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Install RClimDex numerical dependencies
        run: |
          Rscript -e 'install.packages(c("PCICt", "Rcpp", "climdex.pcic"), repos="https://cloud.r-project.org")'
      - name: Generate independent R reference outputs
        run: Rscript tests/external/rclimdex_reference.R
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install climatevar
        run: python -m pip install -e ".[test,stats]"
      - name: Compare climatevar with RClimDex
        run: python tests/external/compare_rclimdex.py
